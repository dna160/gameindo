services:
  db:
    image: mariadb:10.11
    container_name: gameindo_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gameindo
      MYSQL_USER: gameindo
      MYSQL_PASSWORD: gameindo
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: gameindo_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: gameindo
      WORDPRESS_DB_USER: gameindo
      WORDPRESS_DB_PASSWORD: gameindo
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '256M');
        define('FS_METHOD', 'direct');
    volumes:
      - wp_core:/var/www/html
      - ./themes/gameindo:/var/www/html/wp-content/themes/gameindo
      - ./plugins/gameindo-core:/var/www/html/wp-content/plugins/gameindo-core
      - ../assets:/var/www/html/wp-content/gameindo-assets:ro
      - ../data:/var/www/html/wp-content/gameindo-data:ro

  wpcli:
    image: wordpress:cli-php8.2
    container_name: gameindo_cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: gameindo
      WORDPRESS_DB_USER: gameindo
      WORDPRESS_DB_PASSWORD: gameindo
    volumes:
      - wp_core:/var/www/html
      - ./themes/gameindo:/var/www/html/wp-content/themes/gameindo
      - ./plugins/gameindo-core:/var/www/html/wp-content/plugins/gameindo-core
      - ../assets:/var/www/html/wp-content/gameindo-assets:ro
      - ../data:/var/www/html/wp-content/gameindo-data:ro
      - ./import:/import
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_core:
